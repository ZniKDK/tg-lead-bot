# Настройки бизнеса. Скопируйте файл в config.toml и поменяйте под себя.
# После правки перезапустите бота. Секреты (токен, ID админов) — в .env.

[business]
name = "Барбершоп «Бритва»"
address = "Москва, ул. Примерная, 1"
phone = "+7 999 000-00-00"
# Часовой пояс, в котором работает бизнес (сервер может стоять в другом)
timezone = "Europe/Moscow"

# Услуги: название и цена (цену можно не указывать)
[[services]]
name = "Мужская стрижка"
price = "1 500 ₽"

[[services]]
name = "Стрижка бороды"
price = "900 ₽"

[[services]]
name = "Стрижка + борода"
price = "2 200 ₽"

[[services]]
name = "Детская стрижка"
price = "1 000 ₽"

# Рабочие часы. Перерыв — через запятую: "10:00-14:00, 15:00-20:00".
# День не указан — выходной.
[schedule]
mon = "10:00-14:00, 15:00-20:00"
tue = "10:00-14:00, 15:00-20:00"
wed = "10:00-14:00, 15:00-20:00"
thu = "10:00-14:00, 15:00-20:00"
fri = "10:00-14:00, 15:00-20:00"
sat = "11:00-18:00"
# sun — выходной

[booking]
slot_minutes = 60          # длина одного окна записи, минут
days_ahead = 14            # на сколько дней вперёд открыта запись
min_minutes_before = 60    # нельзя записаться ближе, чем за час до начала
max_active_per_user = 2    # сколько будущих записей может быть у одного клиента
cancel_hours_before = 2    # позже клиент отменяет только по телефону
holidays = ["2026-12-31", "2027-01-01", "2027-01-02"]

[reminders]
day_before = true          # напоминание за сутки
hours_before = 2           # и ещё одно за 2 часа; 0 — не отправлять
